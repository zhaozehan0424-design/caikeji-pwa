  <style>
    body { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; color: #20272c; font: 16px/1.8 -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif; }

<body>
  <h1>材科记隐私政策</h1>
  <p>生效日期：2026年7月14日</p>
  <p>材科记是一款离线学习工具，按照最少数据原则设计。</p>
  <h2>数据收集</h2>
  <p>材科记不要求注册账号，不收集、上传、出售或共享个人信息，也不使用广告、分析统计或跨应用追踪服务。</p>
  <h2>本地数据</h2>
  <p>学习进度、错题、收藏和设置仅保存在当前设备。用户主动导出的学习记录文件由用户自行保管，应用不会上传该文件。</p>
  <h2>网络与第三方</h2>
  <p>题库、知识点、图标和题图均随应用提供，核心功能无需联网。应用不会向课程平台发送学习记录。</p>
  <h2>数据删除</h2>
  <p>用户可在“学习统计”中清空学习记录；删除应用或清除站点数据也会删除本地记录。</p>
  <h2>联系我们</h2>
  <p>可通过 <a href="https://github.com/zhaozehan0424-design/caikeji-pwa/issues">项目问题反馈页</a> 提交隐私问题。</p>
</body>
