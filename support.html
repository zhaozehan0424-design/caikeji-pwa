<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>材科记支持</title>
  <style>
    body { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; color: #20272c; font: 16px/1.8 -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif; }
    h1, h2 { color: #183d54; }
    h1 { font-size: 28px; }
    h2 { margin-top: 30px; font-size: 19px; }
    a { color: #176b65; }
  </style>
</head>
<body>
  <h1>材科记支持</h1>
  <p>反馈题目时请附上题号、题干、当前答案以及认为需要修正的具体位置。</p>
  <h2>学习记录</h2>
  <p>记录保存在当前设备。换设备或重装前，可在“学习统计”中导出记录，之后用同一位置的“导入”恢复。</p>
  <h2>离线使用</h2>
  <p>首次完整打开后，PWA可离线使用。新版本发布后，联网打开会更新题库与程序文件。</p>
  <h2>题目口径</h2>
  <p>带“教材校正”标记的题目存在平台错键、重复选项或表述歧义，当前答案按教材概念整理，并在解析中保留说明。</p>
  <h2>问题反馈</h2>
  <p>前往 <a href="https://github.com/zhaozehan0424-design/caikeji-pwa/issues">GitHub Issues</a> 提交问题。</p>
</body>
</html>
